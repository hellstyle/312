[!help_rental]
response: 🎮 Команды аренды игр:

!select_game [игра] - выбрать игру для аренды
!downloaded - сообщить что игра скачана (начинается отсчет времени)
!rental_status - проверить статус аренды
!extend [часы] - продлить аренду

📋 Как это работает:
1. Оформите заказ на аренду
2. Получите данные аккаунта
3. Выберите игру командой !select_game
4. Скачайте игру и отправьте !downloaded
5. Время начнется после скачивания
6. По окончании времени сессия завершится автоматически
